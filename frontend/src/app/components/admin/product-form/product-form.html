<div class="container product-form-page">
  <h2 class="form-title">{{ productId ? 'Modifier le produit' : 'Ajouter un produit' }}</h2>

  <form (ngSubmit)="submitForm()" class="product-form">
    <div class="form-group">
      <label>Nom</label>
      <input type="text" [(ngModel)]="name" name="name" required>
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" [(ngModel)]="description" name="description" required>
    </div>
    <div class="form-group">
      <label>Prix (DT)</label>
      <input type="number" [(ngModel)]="price" name="price" required>
    </div>
    <div class="form-group">
      <label>Image</label>
<img *ngIf="image" [src]="imageBaseUrl + image" alt="Image actuelle" class="current-image">      <input type="file" (change)="onFileSelected($event)" name="image" [required]="!productId">
      <span class="field-hint" *ngIf="productId">Laisser vide pour garder l'image actuelle.</span>
    </div>
    <div class="form-group">
      <label>Catégorie</label>
      <input type="text" [(ngModel)]="category" name="category" required>
    </div>
    <div class="form-group">
      <label>Stock</label>
      <input type="number" [(ngModel)]="stock" name="stock" required>
    </div>
    <button type="submit">Enregistrer</button>
  </form>
</div>

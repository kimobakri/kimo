<div class="container orders-page">
  <h2>Commandes confirmées</h2>

  <div *ngIf="orders.length === 0" class="state-message">
    <p>Aucune commande confirmée pour le moment.</p>
  </div>

  <div class="table-wrapper" *ngIf="orders.length > 0">
    <table>
      <tr>
        <th>Client</th><th>Téléphone</th><th>Adresse</th><th>Total</th><th>Action</th>
      </tr>
      <tr *ngFor="let order of orders">
        <td>{{ order.customerName }}</td>
        <td>{{ order.phone }}</td>
        <td>{{ order.address }}</td>
        <td class="order-total">{{ order.total }} DT</td>
        <td><button class="delete-btn" (click)="removeFromList(order._id)">Supprimer</button></td>
      </tr>
    </table>
  </div>
</div>
